services:
  client:
    build: client
    ports:
      - 5173:5173
    volumes:
      - ./client:/app
      - client:/app/node_modules
    command: npm run dev

  server:
    build: server
    ports:
      - 3000:3000
    volumes:
      - ./server:/app
      - server:/app/node_modules
    command: npx nodemon -L server.js

volumes:
  client:
  server:
